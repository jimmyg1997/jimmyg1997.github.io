<div class="page__footer-follow">
  <div class="footer-main">
    <div class="footer-content">
      <div class="footer-panel footer-social">
        <h4>Connect</h4>
        <div class="social-links">
          <a href="https://www.linkedin.com/in/dimitrios-georgiou/" target="_blank" rel="noopener noreferrer" class="social-link" title="LinkedIn" aria-label="LinkedIn">
            <i class="fab fa-linkedin" aria-hidden="true"></i>
          </a>
          <a href="https://github.com/dimigeorgiou/" target="_blank" rel="noopener noreferrer" class="social-link" title="GitHub" aria-label="GitHub">
            <i class="fab fa-github" aria-hidden="true"></i>
          </a>
          <a href="https://scholar.google.com/citations?user=whiGlXQAAAAJ&amp;hl=en" target="_blank" rel="noopener noreferrer" class="social-link" title="Google Scholar" aria-label="Google Scholar">
            <i class="fas fa-graduation-cap" aria-hidden="true"></i>
          </a>
          <a href="mailto:dgeorgiou3@gmail.com" class="social-link" title="Email" aria-label="Email">
            <i class="fas fa-envelope" aria-hidden="true"></i>
          </a>
          <a href="https://x.com/jimmyg1997" target="_blank" rel="noopener noreferrer" class="social-link" title="X" aria-label="X">
            <i class="fab fa-twitter" aria-hidden="true"></i>
          </a>
        </div>
      </div>

      <div class="footer-panel footer-newsletter">
        <h4>Newsletter</h4>
        <form action="https://gmail.us3.list-manage.com/subscribe/post?u=c76a8e2ec2bd989affb9a074f&amp;id=4646542adb" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_blank" novalidate>
          <div class="newsletter-input-group">
            <label class="footer-sr-only" for="mce-EMAIL">Email address</label>
            <input type="email" name="EMAIL" id="mce-EMAIL" placeholder="Your email" required autocomplete="email">
            <button type="submit" class="newsletter-btn" id="newsletter-submit">Subscribe</button>
          </div>
          <div class="footer-honeypot" aria-hidden="true">
            <input type="text" name="b_c76a8e2ec2bd989affb9a074f_4646542adb" tabindex="-1" value="">
          </div>
        </form>
      </div>

      <div class="footer-panel footer-stats">
        <h4>Site Stats</h4>
        <div class="visitor-counter">
          <span class="visitor-text">Total visitors</span>
          <span class="visitor-number" id="visitor-count" aria-live="polite">…</span>
        </div>
        <ul class="footer-meta">
          <li>Kraków, Poland · Updated {{ site.time | date: '%B %Y' }}</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <p class="footer-bar__copy">&copy; {{ site.time | date: '%Y' }} Dimitrios Georgiou</p>
    <div class="footer-bar__tagline">
      {% include site-tagline.html variant="footer" %}
    </div>
  </div>

  <script>
  (function() {
    const counterKey = 'dimitriosgeorgiou_visitor_count';
    const sessionKey = 'dimitriosgeorgiou_session_id';

    let sessionId = sessionStorage.getItem(sessionKey);
    if (!sessionId) {
      sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      sessionStorage.setItem(sessionKey, sessionId);
    }

    const countedSessions = JSON.parse(localStorage.getItem('counted_sessions') || '[]');
    const isNewSession = !countedSessions.includes(sessionId);
    const countEl = document.getElementById('visitor-count');

    function setCount(value) {
      if (countEl) countEl.textContent = Number(value).toLocaleString();
    }

    if (isNewSession) {
      fetch('https://api.countapi.xyz/hit/dimitriosgeorgiou.github.io/visits')
        .then(response => response.json())
        .then(data => {
          countedSessions.push(sessionId);
          localStorage.setItem('counted_sessions', JSON.stringify(countedSessions));
          setCount(data.value);
        })
        .catch(() => {
          let localCount = parseInt(localStorage.getItem(counterKey) || '1000', 10);
          localCount++;
          localStorage.setItem(counterKey, localCount.toString());
          setCount(localCount);
        });
    } else {
      fetch('https://api.countapi.xyz/get/dimitriosgeorgiou.github.io/visits')
        .then(response => response.json())
        .then(data => setCount(data.value))
        .catch(() => {
          setCount(parseInt(localStorage.getItem(counterKey) || '1000', 10));
        });
    }
  })();

  document.addEventListener('DOMContentLoaded', function() {
    const emailInput = document.getElementById('mce-EMAIL');
    const submitBtn = document.getElementById('newsletter-submit');
    const form = document.getElementById('mc-embedded-subscribe-form');
    if (!emailInput || !submitBtn || !form) return;

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function updateButtonState() {
      submitBtn.disabled = false;
    }

    emailInput.addEventListener('input', function() {
      emailInput.removeAttribute('aria-invalid');
    });
    form.addEventListener('submit', function(e) {
      if (!validateEmail(emailInput.value.trim())) {
        e.preventDefault();
        emailInput.focus();
        emailInput.setAttribute('aria-invalid', 'true');
      } else {
        emailInput.removeAttribute('aria-invalid');
      }
    });

    updateButtonState();
  });
  </script>
</div>
