<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Footer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        .content {
            flex: 1;
            padding: 3rem;
            color: #555;
            text-align: center;
        }

        .footer {
            background: #0f1419;
            color: #e0e6ed;
            padding: 2.5rem 2rem;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .footer-container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 3rem;
        }

        /* Left: Social Links */
        .footer-social {
            display: flex;
            gap: 0.8rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .social-link i {
            font-size: 1rem;
        }

        /* Center: Visitor Counter & Newsletter */
        .footer-center {
            text-align: center;
        }

        .visitor-counter {
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #b0b8c1;
        }

        .visitor-number {
            font-weight: 700;
            font-family: 'Courier New', monospace;
            font-size: 2rem;
            color: #4a90e2;
            display: block;
            margin: 0.3rem 0;
            text-shadow: 0 2px 8px rgba(74, 144, 226, 0.2);
        }

        .newsletter-form {
            display: flex;
            gap: 0.4rem;
        }

        .newsletter-input {
            padding: 0.65rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .newsletter-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .newsletter-input:focus {
            outline: none;
            border-color: rgba(74, 144, 226, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .newsletter-btn {
            padding: 0.65rem 1.2rem;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .newsletter-btn:hover {
            background: #357abd;
            transform: translateY(-1px);
        }

        /* Right: Info */
        .footer-info {
            text-align: right;
        }

        .footer-info p {
            font-size: 0.85rem;
            color: #b0b8c1;
            line-height: 1.5;
            margin: 0.2rem 0;
        }

        .footer-info .meta {
            font-size: 0.8rem;
            color: #8a92a0;
            margin-top: 0.3rem;
        }

        .footer-info .subtitle {
            font-size: 0.8rem;
            color: #4a90e2;
            font-style: italic;
            margin-top: 0.3rem;
        }

        /* Bottom divider */
        .footer::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        /* Mobile */
        @media (max-width: 768px) {
            .footer {
                padding: 1.5rem 1rem;
            }

            .footer-container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .footer-social {
                justify-content: center;
            }

            .footer-info {
                text-align: center;
            }

            .newsletter-input {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Your Website Content Goes Here</h1>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <!-- Left: Social -->
            <div class="footer-social">
                <a href="https://www.linkedin.com/in/dimitriosgeorgiou/" target="_blank" rel="noopener noreferrer" class="social-link" title="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://github.com/jimmyg1997/" target="_blank" rel="noopener noreferrer" class="social-link" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://scholar.google.com/citations?user=whiGlXQAAAAJ&hl=en" target="_blank" rel="noopener noreferrer" class="social-link" title="Google Scholar">
                    <i class="fas fa-graduation-cap"></i>
                </a>
                <a href="mailto:dgeorgiou3@gmail.com" class="social-link" title="Email">
                    <i class="fas fa-envelope"></i>
                </a>
                <a href="https://twitter.com/jimmyg1997" target="_blank" rel="noopener noreferrer" class="social-link" title="Twitter">
                    <i class="fab fa-twitter"></i>
                </a>
            </div>

            <!-- Center: Visitor & Newsletter -->
            <div class="footer-center">
                <div class="visitor-counter">
                    <span>You are visitor #</span>
                    <span class="visitor-number">1,055</span>
                </div>
                <form class="newsletter-form">
                    <input type="email" class="newsletter-input" placeholder="Email address" required>
                    <button type="submit" class="newsletter-btn">
                        <i class="fas fa-bell"></i>
                    </button>
                </form>
            </div>

            <!-- Right: Info -->
            <div class="footer-info">
                <p>&copy; 2025 Dimitrios Georgiou</p>
                <div class="meta">
                    📍 Athens, Greece
                </div>
                <p class="subtitle">Data Scientist • Researcher • Calisthenics Athlete</p>
            </div>
        </div>
    </footer>

    <script>
        document.querySelector('.newsletter-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = this.querySelector('.newsletter-input').value;
            if (email) {
                alert('Thank you for subscribing!');
                this.reset();
            }
        });
    </script>
</body>
</html>
