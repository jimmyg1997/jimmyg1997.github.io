  <script>
  // Enhanced visitor counter with session tracking
  (function() {
    const counterKey = 'dimitriosgeorgiou_visitor_count';
    const sessionKey = 'dimitriosgeorgiou_session_id';
    
    // Generate unique session ID if not exists
    let sessionId = sessionStorage.getItem(sessionKey);
    if (!sessionId) {
      sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      sessionStorage.setItem(sessionKey, sessionId);
    }
    
    // Check if this session has already been counted
    const countedSessions = JSON.parse(localStorage.getItem('counted_sessions') || '[]');
    const isNewSession = !countedSessions.includes(sessionId);
    
    if (isNewSession) {
      // Increment counter for new session
      fetch('https://api.countapi.xyz/hit/dimitriosgeorgiou.github.io/visits')
        .then(response => response.json())
        .then(data => {
          // Store this session as counted
          countedSessions.push(sessionId);
          localStorage.setItem('counted_sessions', JSON.stringify(countedSessions));
          
          // Update display
          document.getElementById('visitor-count').textContent = data.value.toLocaleString();
        })
        .catch(error => {
          // Fallback: use local storage counter
          let localCount = parseInt(localStorage.getItem(counterKey) || '1000');
          localCount++;
          localStorage.setItem(counterKey, localCount.toString());
          document.getElementById('visitor-count').textContent = localCount.toLocaleString();
        });
    } else {
      // Session already counted, just display current count
      fetch('https://api.countapi.xyz/get/dimitriosgeorgiou.github.io/visits')
        .then(response => response.json())
        .then(data => {
          document.getElementById('visitor-count').textContent = data.value.toLocaleString();
        })
        .catch(error => {
          const localCount = parseInt(localStorage.getItem(counterKey) || '1000');
          document.getElementById('visitor-count').textContent = localCount.toLocaleString();
        });
    }
  })();
  </script>
