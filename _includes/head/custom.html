<script>
// Comprehensive jQuery patch to prevent all smooth-scroll errors
(function() {
  var checkInterval = setInterval(function() {
    if (typeof jQuery !== 'undefined') {
      clearInterval(checkInterval);
      
      // 1. Patch jQuery.fn.init to catch empty selectors
      var originalInit = jQuery.fn.init;
      jQuery.fn.init = function(selector, context, root) {
        if (selector === '#' || selector === '#_' || selector === '') {
          return originalInit.call(this, [], context, root);
        }
        try {
          return originalInit.call(this, selector, context, root);
        } catch (e) {
          console.warn('jQuery selector error caught:', selector);
          return originalInit.call(this, [], context, root);
        }
      };
      jQuery.fn.init.prototype = originalInit.prototype;
      
      // 2. Patch jQuery.fn.offset to return safe values for empty objects
      var originalOffset = jQuery.fn.offset;
      jQuery.fn.offset = function() {
        if (this.length === 0) {
          return { top: 0, left: 0 };
        }
        return originalOffset.apply(this, arguments);
      };
      
      // 3. Disable theme's smooth scroll entirely
      jQuery(document).off('click.smoothScroll');
      jQuery(document).on('click.smoothScroll', 'a[href^="#"]', function(e) {
        var href = jQuery(this).attr('href');
        if (!href || href === '#' || href === '#_' || href === '') {
          e.preventDefault();
          e.stopImmediatePropagation();
          return false;
        }
      });
    }
  }, 1);
})();
</script>

<!-- Prevent dark mode flash -->
<script>
  (function() {
    var stored = localStorage.getItem('dg-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = stored || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
