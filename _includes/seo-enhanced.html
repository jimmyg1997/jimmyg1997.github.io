<!-- Enhanced SEO Meta Tags for Modern Website -->

<!-- Primary Meta Tags -->
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.description }}{% endif %}</title>
<meta name="title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.description }}{% endif %}">
<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
<meta name="keywords" content="Data Science, Machine Learning, Healthcare AI, Research, Python, Deep Learning, Dimitrios Georgiou, HSBC, PhD, Calisthenics, Travel, {% if page.tags %}{{ page.tags | join: ', ' }}{% endif %}">
<meta name="author" content="{{ site.author.name }}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 200 }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:image" content="{% if page.header.overlay_image %}{{ page.header.overlay_image | absolute_url }}{% else %}{{ site.og_image | default: '/assets/images/banner.png' | absolute_url }}{% endif %}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:locale" content="en_US">
{% if page.date %}
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
<meta property="article:author" content="{{ site.author.name }}">
{% endif %}

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 200 }}{% else %}{{ site.description }}{% endif %}">
<meta name="twitter:image" content="{% if page.header.overlay_image %}{{ page.header.overlay_image | absolute_url }}{% else %}{{ site.og_image | default: '/assets/images/banner.png' | absolute_url }}{% endif %}">
<meta name="twitter:creator" content="@{{ site.twitter.username }}">

<!-- LinkedIn -->
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Additional SEO -->
<meta name="theme-color" content="#0052CC">
<meta name="msapplication-TileColor" content="#0052CC">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="{{ site.url }}{{ site.baseurl }}/site.webmanifest">

<!-- Performance & Resource Hints -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://use.fontawesome.com">
<link rel="dns-prefetch" href="https://www.google-analytics.com">

<!-- Structured Data / JSON-LD for Personal Website -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "url": "{{ site.url }}",
  "image": "{{ site.author.avatar | absolute_url }}",
  "jobTitle": "Senior ML Engineer",
  "worksFor": {
    "@type": "Organization",
    "name": "Grid Dynamics"
  },
  "alumniOf": [
    {
      "@type": "EducationalOrganization",
      "name": "National Technical University of Athens"
    }
  ],
  "sameAs": [
    "https://www.linkedin.com/in/dimitriosgeorgiou/",
    "https://github.com/dimigeorgiou/",
    "https://scholar.google.com/citations?user=whiGlXQAAAAJ&hl=en",
    "https://www.instagram.com/dimiles.away/"
  ],
  "description": "{{ site.description }}",
  "email": "dgeorgiou3@gmail.com",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Krakow",
    "addressCountry": "Poland"
  }
}
</script>

{% if page.layout == 'single' and page.title %}
<!-- Article Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ page.title }}",
  "description": "{{ page.excerpt | strip_html | strip_newlines }}",
  "author": {
    "@type": "Person",
    "name": "{{ site.author.name }}"
  },
  {% if page.date %}
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  {% endif %}
  "image": "{% if page.header.overlay_image %}{{ page.header.overlay_image | absolute_url }}{% else %}{{ site.og_image | absolute_url }}{% endif %}",
  "publisher": {
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.author.avatar | absolute_url }}"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  }
}
</script>
{% endif %}

<!-- Accessibility -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<!-- Security -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:; img-src 'self' https: data:; font-src 'self' https: data:;">
<meta name="referrer" content="no-referrer-when-downgrade">

<!-- Performance Monitoring -->
<link rel="preload" as="style" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="preload" as="script" href="{{ '/assets/js/main.min.js' | relative_url }}">
