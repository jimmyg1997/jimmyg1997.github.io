<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel ingest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf8;
      --ink: #111111;
      --muted: #666;
      --line: #e8e8e4;
      --gold: #c8a96e;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    main {
      max-width: 52rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .lede { color: var(--muted); margin: 0 0 1.5rem; }
    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
    }
    .kicker {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 0.35rem;
    }
    .last-title { font-weight: 700; margin: 0; }
    .meta { color: var(--muted); font-size: 0.9rem; margin: 0.2rem 0 0; }
    a { color: var(--ink); }
    .warn { color: #9a3412; font-size: 0.9rem; margin: 0.5rem 0 0; }
    #drop {
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 2rem 1rem;
      text-align: center;
      background: var(--white);
      margin-bottom: 1rem;
    }
    #drop.is-over { border-color: var(--ink); }
    #drop p { margin: 0; color: var(--muted); }
    button {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 6px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--white);
      padding: 0.55rem 0.9rem;
      cursor: pointer;
    }
    button.secondary {
      background: var(--white);
      color: var(--ink);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.75rem 0 1rem; }
    .counts { font-weight: 600; margin: 0 0 1rem; }
    article {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.65rem 0.85rem;
      padding: 0.85rem 0;
      border-top: 1px solid var(--line);
    }
    article img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--line);
    }
    article h3 { margin: 0; font-size: 1rem; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-left: 0.35rem;
      color: var(--muted);
    }
    .badge.new { color: #0f766e; }
    .badge.duplicate, .badge.stop { color: var(--muted); }
    .badge.skip { color: #9a3412; }
    label.pick { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; }
    textarea, input[type="text"] {
      width: 100%;
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
      margin-top: 0.35rem;
    }
    textarea { min-height: 4.5rem; }
    #log { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
  </style>
</head>
<body>
  <main>
    <h1>Travel ingest</h1>
    <p class="lede">Drop whole-tab Instagram screenshots (URL bar visible). The app reads the last post already on the site, then proposes only the ones you do not have yet.</p>

    <section class="card" id="status-card">
      <p class="kicker">Last post on the website</p>
      <p class="last-title" id="last-title">Loading…</p>
      <p class="meta" id="last-meta"></p>
      <p class="meta" id="vision-meta"></p>
    </section>

    <div id="drop">
      <p>Drop PNG / JPG / WebP screenshots here, or click to choose.</p>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
    </div>
    <p id="file-count" class="meta"></p>

    <div class="row">
      <button type="button" id="process" disabled>Process batch</button>
      <button type="button" class="secondary" id="commit" disabled>Append selected to travel-posts-data.js</button>
    </div>
    <p class="counts" id="counts"></p>
    <p id="log"></p>
    <div id="results"></div>
  </main>
  <script>
    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('file');
    const processBtn = document.getElementById('process');
    const commitBtn = document.getElementById('commit');
    const resultsEl = document.getElementById('results');
    const countsEl = document.getElementById('counts');
    const logEl = document.getElementById('log');
    const fileCountEl = document.getElementById('file-count');

    let files = [];
    let drafts = [];
    let previews = [];

    function log(msg) { logEl.textContent = msg || ''; }

    async function loadStatus() {
      const res = await fetch('/api/status');
      const data = await res.json();
      const last = data.lastPost;
      document.getElementById('last-title').textContent = last
        ? last.title
        : 'No travel posts yet';
      document.getElementById('last-meta').innerHTML = last
        ? [last.city, last.country, last.date].filter(Boolean).join(' · ') +
          (last.instagramUrl
            ? ' · <a href="' + last.instagramUrl + '" target="_blank" rel="noopener">Instagram</a>'
            : '') +
          '<br>' + data.postCount + ' posts on the map. Screenshot newer posts, and include this last one as a stop sign.'
        : '';
      const v = document.getElementById('vision-meta');
      if (!data.vision) {
        v.className = 'warn';
        v.textContent = 'Add OPENAI_API_KEY or ANTHROPIC_API_KEY to scripts/travel-ingest/.env, then restart this server.';
      } else {
        v.className = 'meta';
        v.textContent = 'Vision: ' + data.vision;
      }
    }

    function setFiles(list) {
      files = [...list].filter((f) => /^image\/(png|jpeg|webp)$/.test(f.type));
      fileCountEl.textContent = files.length
        ? files.length + ' screenshot' + (files.length === 1 ? '' : 's') + ' ready'
        : '';
      processBtn.disabled = files.length === 0;
      drafts = [];
      previews = [];
      resultsEl.innerHTML = '';
      countsEl.textContent = '';
      commitBtn.disabled = true;
    }

    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('is-over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('is-over'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('is-over');
      setFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => setFiles(fileInput.files));

    function resize(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1400;
          let w = img.width;
          let h = img.height;
          if (w > max || h > max) {
            const s = Math.min(max / w, max / h);
            w = Math.round(w * s);
            h = Math.round(h * s);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          canvas.toBlob((blob) => {
            const reader = new FileReader();
            reader.onload = () => {
              const b64 = reader.result.split(',')[1];
              resolve({ data: b64, mime: 'image/jpeg', name: file.name, preview: canvas.toDataURL('image/jpeg', 0.6) });
            };
            reader.readAsDataURL(blob);
          }, 'image/jpeg', 0.82);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read ' + file.name)); };
        img.src = url;
      });
    }

    function render() {
      const nNew = drafts.filter((d) => d.status === 'new' && d.selected).length;
      const nDup = drafts.filter((d) => d.status === 'duplicate').length;
      const nStop = drafts.filter((d) => d.status === 'stop').length;
      const nSkip = drafts.filter((d) => d.status === 'skip').length;
      countsEl.textContent =
        drafts.length
          ? (nNew + ' missing vs this batch · ' + nStop + ' last-on-site · ' + nDup + ' already on the map · ' + nSkip + ' not travel')
          : '';
      commitBtn.disabled = nNew === 0;
      resultsEl.innerHTML = drafts.map((d, i) => {
        const checked = d.selected ? 'checked' : '';
        const disable = d.status !== 'new' ? 'disabled' : '';
        return '<article>' +
          '<img alt="" src="' + previews[i] + '">' +
          '<div>' +
          '<label class="pick"><input type="checkbox" data-i="' + i + '" ' + checked + ' ' + disable + '> Include</label>' +
          '<h3>' + escapeHtml(d.title || d.filename) + '<span class="badge ' + d.status + '">' + d.status + '</span></h3>' +
          '<p class="meta">' + escapeHtml([d.city, d.country, d.date, d.instagramPostId].filter(Boolean).join(' · ')) + '</p>' +
          '<input type="text" data-field="title" data-i="' + i + '" value="' + attr(d.title) + '" placeholder="Title">' +
          '<input type="text" data-field="city" data-i="' + i + '" value="' + attr(d.city) + '" placeholder="City">' +
          '<input type="text" data-field="country" data-i="' + i + '" value="' + attr(d.country) + '" placeholder="Country">' +
          '<input type="text" data-field="date" data-i="' + i + '" value="' + attr(d.date) + '" placeholder="YYYY.MM">' +
          '<input type="text" data-field="instagramUrl" data-i="' + i + '" value="' + attr(d.instagramUrl) + '" placeholder="https://www.instagram.com/p/…">' +
          '<textarea data-field="description" data-i="' + i + '">' + escapeHtml(d.description || '') + '</textarea>' +
          '</div></article>';
      }).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function attr(s) { return escapeHtml(s || ''); }

    resultsEl.addEventListener('change', (e) => {
      const t = e.target;
      const i = Number(t.getAttribute('data-i'));
      if (Number.isNaN(i) || !drafts[i]) return;
      if (t.type === 'checkbox') {
        drafts[i].selected = t.checked;
        render();
        return;
      }
      drafts[i][t.getAttribute('data-field')] = t.value;
      if (t.getAttribute('data-field') === 'instagramUrl') {
        const m = t.value.match(/instagram\.com\/(?:p|reel|reels)\/([A-Za-z0-9_-]+)/i);
        if (m) drafts[i].instagramPostId = m[1];
      }
    });
    resultsEl.addEventListener('input', (e) => {
      const t = e.target;
      const i = Number(t.getAttribute('data-i'));
      if (Number.isNaN(i) || !drafts[i] || t.type === 'checkbox') return;
      drafts[i][t.getAttribute('data-field')] = t.value;
    });

    processBtn.addEventListener('click', async () => {
      processBtn.disabled = true;
      drafts = [];
      previews = [];
      for (let i = 0; i < files.length; i++) {
        log('Processing ' + (i + 1) + ' / ' + files.length + ' — ' + files[i].name);
        try {
          const img = await resize(files[i]);
          previews.push(img.preview);
          const res = await fetch('/api/process-one', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: img.data, mime: img.mime, name: img.name })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed');
          data.post.selected = data.post.status === 'new';
          drafts.push(data.post);
        } catch (err) {
          previews.push('');
          drafts.push({
            filename: files[i].name,
            title: files[i].name,
            status: 'skip',
            selected: false,
            description: err.message
          });
        }
        render();
      }
      log('Done.');
      processBtn.disabled = files.length === 0;
    });

    commitBtn.addEventListener('click', async () => {
      const selected = drafts.filter((d) => d.selected && d.status === 'new');
      commitBtn.disabled = true;
      log('Writing…');
      const res = await fetch('/api/commit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ posts: selected })
      });
      const data = await res.json();
      if (!res.ok) {
        log(data.error || 'Write failed');
        commitBtn.disabled = false;
        return;
      }
      log('Appended ' + data.written + ' post(s) to ' + data.file + '. Refresh the travel page after Jekyll rebuilds.');
      await loadStatus();
    });

    loadStatus().catch((e) => {
      document.getElementById('last-title').textContent = 'Could not load travel data';
      document.getElementById('last-meta').textContent = e.message;
    });
  </script>
</body>
</html>
